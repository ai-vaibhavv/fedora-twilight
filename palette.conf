# Twilight palette
# ----------------
# Every colour used by the customisation lives here. Change these to match
# your own wallpaper, then run `./install.sh` again (it is safe to re-run).
#
# Tip: `./scripts/palette-from-wallpaper.py ~/Pictures/your-wallpaper.jpg`
# prints a suggested palette you can paste over these values.

# Deep background: glyphs on window buttons, entry fills, panel shadows
BASE=#1E2030
# Raised surfaces: dock, Qt/LibreOffice title bars
SURFACE=#2C2E45
# Surface for unfocused windows
SURFACE_DIM=#25273A
# Borders and neutral buttons
BORDER=#434553
BORDER_DIM=#34364D

# Text
TEXT=#F1EDF7
TEXT_BRIGHT=#F7F3FC
TEXT_DIM=#A6A3BD
# Soft lavender used for dates, hints, placeholders
SUBTEXT=#D8C7F5

# Main accent (focus rings, borders on glass)
ACCENT=#B4A1E5

# The three window buttons, macOS-style: close, minimise, maximise
CLOSE=#EAA0BC
MINIMIZE=#F2B49C
MAXIMIZE=#8EACED

# Top-bar pills (GNOME Shell)
PANEL_PILL=#232634
PANEL_HOVER=#424451
PANEL_ACTIVE=#565964

# Upstream theme variants this palette sits on top of.
#   COLLOID_COLOR : default purple pink red orange yellow green teal grey
#   PAPIRUS_FOLDER: violet magenta blue indigo pink red orange yellow green teal cyan grey …
#   CURSOR        : any catppuccin-<flavour>-<accent>-cursors release name
#   GNOME_ACCENT  : blue teal green yellow orange red pink purple slate
COLLOID_COLOR=purple
PAPIRUS_FOLDER=violet
CURSOR=catppuccin-mocha-lavender-cursors
GNOME_ACCENT=purple
#   COLLOID_TWEAKS: colour scheme (catppuccin nord dracula gruvbox everforest) plus
#                   "normal" = plain GNOME-style buttons that Twilight recolours
COLLOID_TWEAKS="catppuccin normal"

# Lock screen layout: horizontal position of the big clock.
# 0.5 = centred. Twilight uses 0.76 to keep the clock off the wallpaper's subject.
LOCK_CLOCK_X=0.76
