# Loaded with `dconf load /` by install.sh after the colour placeholders are rendered.
# Only appearance-related keys live here; shortcuts are in shortcuts.ini and
# personal keys (weather location, recent files…) are deliberately left out.

[org/gnome/desktop/interface]
color-scheme='prefer-dark'
accent-color='{{GNOME_ACCENT}}'
gtk-theme='Colloid-Twilight-Dark'
icon-theme='Twilight-Controls'
cursor-theme='{{CURSOR}}'
cursor-size=24
font-name='Inter 11'
document-font-name='Inter 11'
monospace-font-name='JetBrains Mono 11'

[org/gnome/desktop/wm/preferences]
button-layout=':minimize,maximize,close'

[org/gnome/desktop/sound]
theme-name='Twilight'

[org/gnome/desktop/background]
picture-options='zoom'

[org/gnome/shell/extensions/user-theme]
name='Colloid-Twilight-Dark'

[org/gnome/shell/extensions/dash-to-dock]
apply-custom-theme=false
autohide=true
background-color='{{SURFACE}}'
background-opacity=0.88
custom-background-color=true
custom-theme-shrink=true
dash-max-icon-size=48
dock-fixed=false
dock-position='BOTTOM'
extend-height=false
intellihide=true
intellihide-mode='ALL_WINDOWS'
show-mounts=false
show-trash=false
transparency-mode='FIXED'

[org/gnome/shell/extensions/just-perfection]
animation=2
double-super-to-appgrid=true
notification-banner-position=2
osd-position=4
panel-button-padding-size=0
panel-indicator-padding-size=0
startup-status=1
theme=false
window-picker-icon=true

[org/gnome/shell/extensions/rounded-windows]
corner-radius=16
custom-shadow=true
keep-rounded-fullscreen=false
keep-rounded-maximized=true
smoothing=0.55

[org/gnome/shell/extensions/tilingshell]
layouts-json='[{"id":"Layout 1","tiles":[{"x":0,"y":0,"width":0.22,"height":0.5,"groups":[1,2]},{"x":0,"y":0.5,"width":0.22,"height":0.5,"groups":[1,2]},{"x":0.22,"y":0,"width":0.56,"height":1,"groups":[2,3]},{"x":0.78,"y":0,"width":0.22,"height":0.5,"groups":[3,4]},{"x":0.78,"y":0.5,"width":0.22,"height":0.5,"groups":[3,4]}]},{"id":"Layout 2","tiles":[{"x":0,"y":0,"width":0.22,"height":1,"groups":[1]},{"x":0.22,"y":0,"width":0.56,"height":1,"groups":[1,2]},{"x":0.78,"y":0,"width":0.22,"height":1,"groups":[2]}]},{"id":"Layout 3","tiles":[{"x":0,"y":0,"width":0.33,"height":1,"groups":[1]},{"x":0.33,"y":0,"width":0.67,"height":1,"groups":[1]}]},{"id":"Layout 4","tiles":[{"x":0,"y":0,"width":0.67,"height":1,"groups":[1]},{"x":0.67,"y":0,"width":0.33,"height":1,"groups":[1]}]}]'
window-use-custom-border-color=false

[org/gnome/shell/extensions/caffeine]
enable-fullscreen=true
show-indicator='only-active'
show-notifications=false

[org/gnome/shell/extensions/clipboard-indicator]
blink-icon-on-copy=true
enable-keybindings=true
open-at-cursor=true

[org/gnome/shell/extensions/wack-lockscreen-clock]
clock-animation='fade'
date-style='full'
esc-to-sleep=false
lockscreen-mode='wack'
lockscreen-wallpaper-enable=false
prompt-animation='rise'

[org/gnome/Ptyxis]
font-name='JetBrains Mono 12'
use-system-font=false
cursor-shape='ibeam'
