# Twilight keyboard shortcuts, loaded with `dconf load /` by `install.sh --only shortcuts`.
# App launchers (Super+T, Super+E) are added separately by install.sh so that
# shortcuts you already created are kept.
#
# Tiling Shell manages the maximize / tiling keys itself, so they are not set here.

[org/gnome/desktop/wm/keybindings]
close=['<Super>q', '<Alt>F4']
switch-to-workspace-left=['<Super><Control>Left']
switch-to-workspace-right=['<Super><Control>Right']
move-to-workspace-left=['<Super><Control><Shift>Left']
move-to-workspace-right=['<Super><Control><Shift>Right']

[org/gnome/shell/keybindings]
toggle-message-tray=['<Super>m']

[org/gnome/shell/extensions/clipboard-indicator]
toggle-menu=['<Super>v']

[org/gnome/shell/extensions/caffeine]
toggle-shortcut=['<Super><Shift>c']
